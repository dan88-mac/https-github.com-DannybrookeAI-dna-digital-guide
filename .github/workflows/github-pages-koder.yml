# GitHub Pages (view site in iPhone Safari)
name: Pages — Resync preview site

on:
  push:
    branches: [main, cursor/resync-ai-full-build-86ce]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r koder-pack/* _site/
          touch _site/.nojekyll
          echo '<meta http-equiv="refresh" content="0;url=./index.html">' > _site/root.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
