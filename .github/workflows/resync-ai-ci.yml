name: Deploy Resync AI CI

on:
  push:
    branches: [main, cursor/resync-ai-full-build-86ce]
    paths: ["resync-ai/**"]
  pull_request:
    paths: ["resync-ai/**"]

defaults:
  run:
    working-directory: resync-ai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "${RUNNER_TEMP}/typecheck.log"
      - name: Report typecheck errors
        if: failure()
        run: |
          echo "### Typecheck output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -100 "${RUNNER_TEMP}/typecheck.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://placeholder.vercel.app
