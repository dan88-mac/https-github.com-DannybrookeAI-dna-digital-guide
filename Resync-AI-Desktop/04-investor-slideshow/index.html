  <script>
    const stage = document.getElementById("stage");
    const raw = document.getElementById("slides-data");
    const sections = Array.from(raw.content.querySelectorAll("section"));
    sections.forEach((sec, i) => {
      const slide = document.createElement("article");
      slide.className = "slide" + (i === 0 ? " active" : "");
      slide.innerHTML = sec.innerHTML;
      stage.appendChild(slide);
    });
    const slides = Array.from(document.querySelectorAll(".slide"));
    const dots = document.getElementById("dots");
    slides.forEach((_, i) => {
      const d = document.createElement("span");
      if (i === 0) d.className = "on";
      dots.appendChild(d);
    });
    let idx = 0;
    function show(n) {
      idx = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach((s, i) => s.classList.toggle("active", i === idx));
      dots.querySelectorAll("span").forEach((d, i) => d.classList.toggle("on", i === idx));
      document.getElementById("counter").textContent = idx + 1 + " / " + slides.length;
      document.getElementById("prev").disabled = idx === 0;
      document.getElementById("next").disabled = idx === slides.length - 1;
    }
    document.getElementById("prev").onclick = () => show(idx - 1);
    document.getElementById("next").onclick = () => show(idx + 1);
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); show(idx + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); show(idx - 1); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(slides.length - 1);
      if (e.key.toLowerCase() === "p") window.print();
    });
    show(0);
  </script>
